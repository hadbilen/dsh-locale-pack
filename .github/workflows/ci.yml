name: ci
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/build-client.mjs
      - run: node tools/smoke.mjs
      - run: node tools/check-keep.mjs
      - run: git diff --exit-code -- lib/client.js
        # lib/client.js is generated: locale/**/*.json edits must be rebuilt
